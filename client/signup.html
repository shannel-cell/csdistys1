<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Signup</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f2f4f8; display: flex;
           justify-content: center; padding-top: 60px; }
    form { background: #fff; padding: 30px; border-radius: 8px; width: 320px;
           box-shadow: 0 2px 8px rgba(0,0,0,.15); }
    h2 { margin-top: 0; text-align: center; }
    input { width: 100%; padding: 10px; margin: 8px 0 14px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #1a73e8; color: #fff;
             border: none; border-radius: 4px; cursor: pointer; }
    #message { margin-top: 12px; text-align: center; font-weight: bold; word-break: break-word; }
  </style>
</head>
<body>
  <form id="signupForm">
    <h2>Sign Up</h2>
    <label>Full Name</label>
    <input type="text" name="full_name" required>
    <label>Email</label>
    <input type="email" name="email" required>
    <label>Password</label>
    <input type="password" name="password" minlength="8" required>
    <button type="submit">Register</button>
    <div id="message"></div>
  </form>

  <script>
    document.getElementById("signupForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("message");
      try {
        const res = await fetch("../server/register.php", {
          method: "POST",
          body: new FormData(e.target)
        });
        const text = await res.text();
        try {
          const data = JSON.parse(text);
          msg.style.color = data.success ? "green" : "red";
          msg.textContent = data.message;
          if (data.success) e.target.reset();
        } catch (parseErr) {
          msg.style.color = "red";
          msg.textContent = "Server replied (status " + res.status + "): " + text.substring(0, 300);
        }
      } catch (err) {
        msg.style.color = "red";
        msg.textContent = "Fetch failed: " + err.message;
      }
    });
  </script>
</body>
</html>
